[package]
name = "tray-run"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Run a console command hidden, toggle its window from the tray icon"

[[bin]]
name = "tray-run"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
lto = true
strip = true

[build-dependencies]
winres = "0.1.12"
